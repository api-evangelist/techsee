    status: 200
    content_type: application/json
    file: techsee-oauth-authorization-server.json
    note: >-
      Served after one 301 to the trailing-slash form. Real RFC 8414 metadata:
      issuer https://techsee.com, authorization_endpoint /oauth/authorize,
      token_endpoint /oauth/token, revocation_endpoint /oauth/revoke,
      grant_types authorization_code + refresh_token, PKCE S256 required,
      scopes_supported ["mcp"], token_endpoint_auth_methods ["none"] (public
      clients), client_id_metadata_document_supported true.
  - path: /.well-known/oauth-protected-resource
    status: 200
    content_type: application/json
    file: techsee-oauth-protected-resource.json
    note: >-
      Real RFC 9728 metadata naming the protected resource
      https://techsee.com/wp-json/mcp/mcp-oauth-server, authorization server
      https://techsee.com, bearer token in the Authorization header, scope `mcp`.
