summary: >-
  Two real documents are served, both on the marketing host techsee.com: RFC 8414
  OAuth 2.0 Authorization Server Metadata and RFC 9728 OAuth 2.0 Protected Resource
  Metadata. Together they advertise a live, OAuth-protected Model Context Protocol
  server at https://techsee.com/wp-json/mcp/mcp-oauth-server (scope `mcp`, PKCE
  S256). Nothing else is served: api.techsee.me 404s every path, and app.techsee.me
  is a single-page app whose catch-all answers 200 with the same 1,003-byte HTML
  shell for every /.well-known/* path — those 200s are recorded below as misses,
  not as documents.

hosts:
