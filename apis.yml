aid: techsee
name: TechSee
description: 'TechSee is an Israeli-founded customer-experience software company that
  builds visual assistance and visual agentic AI for customer service, contact centers
  and field service. Its platform — TechSee Live for agent-guided visual sessions and
  Sophie AI for autonomous multimodal virtual agents — combines live video, computer
  vision, augmented reality overlays and screen sharing so that a support agent or an
  AI agent can see what a customer sees and guide them to a resolution. TechSee sells
  into telecommunications, insurance, utilities, consumer electronics, home builders,
  medical devices, retail and BPO, and markets an "open integration platform" of APIs
  plus prebuilt connectors for Salesforce, ServiceNow, Zendesk, Amazon Connect, Oracle,
  Pega, Microsoft Dynamics 365, Amdocs and CSG. Public developer artifacts are limited
  to an iOS mobile SDK on GitHub; the API reference itself is not published publicly.'
